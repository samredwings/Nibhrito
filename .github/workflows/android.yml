name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/contracts/**', 'pnpm-lock.yaml', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @nibhrito/web build
      - run: cd apps/web && pnpm dlx @capacitor/cli@6 add android
        continue-on-error: true
      - run: cd apps/web && pnpm dlx @capacitor/cli@6 sync android
      - run: chmod +x apps/web/android/gradlew && cd apps/web/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nibhrito-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
